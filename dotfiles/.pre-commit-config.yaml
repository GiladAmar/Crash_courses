# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: ["--branch", "main",
               "--branch", "master",
               "--branch", "dev",
               "--branch", "staging"]
      - id: requirements-txt-fixer # Sorts entries in requirements.txt
      - id: trailing-whitespace
      - id: check-illegal-windows-names
      - id: check-case-conflict # Check filenames don't conflict on case-insensitive OSs
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--indent=4"
          - "--no-sort-keys"

  # Take over job of black, flake8 and isort with one tool
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Check type-hinting
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy

  # Remove all cell-outputs from jupyter notebooks
  # This makes sure diffs are simple, and that plots do not bloat the repo
  - repo: https://github.com/srstevenson/nb-clean
    rev: 3.3.0
    hooks:
      - id: nb-clean
